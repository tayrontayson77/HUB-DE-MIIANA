<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administration — HUB DE MIIANA</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><style>:root{--bg:#08060d;--card:#160d1e;--line:#43254b;--red:#ff3865;--violet:#8b3dff;--muted:#b9a7bd}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 70% 0,#421044,#08060d 55%);color:#fff;font-family:Arial,sans-serif;min-height:100vh}.wrap{width:min(1200px,94%);margin:auto;padding:30px 0}.card{background:#160d1eee;border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 20px 70px #0007}.brand{font-size:24px;font-weight:900}.brand span{color:var(--red)}h1{font-size:42px;margin:10px 0}.muted{color:var(--muted);line-height:1.5}.stack{display:grid;gap:10px}.input,textarea,select{width:100%;padding:12px;border-radius:9px;border:1px solid var(--line);background:#0d0812;color:#fff;font:inherit}.btn{padding:11px 15px;border:0;border-radius:9px;color:#fff;font-weight:900;background:linear-gradient(135deg,var(--red),var(--violet));cursor:pointer}.btn.alt{background:#211226;border:1px solid var(--line)}.btn.danger{background:#421526}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.hidden{display:none!important}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:18px}.msg{padding:12px;border-radius:9px;background:#211326;margin:10px 0}.ok{border:1px solid #3b754e}.err{border:1px solid #7b2947}.linkbtn{background:none;border:0;color:#b98cff;text-decoration:underline;cursor:pointer;padding:0;font:inherit}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.category,.member{padding:16px;background:#211326;border:1px solid #392040;border-radius:12px;margin-top:10px}.member{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.role{color:#ff8aa1;font-weight:900;font-size:12px}.pill{display:inline-block;padding:5px 8px;border-radius:20px;background:#301638;color:#d9b9ff;font-size:12px}.sep{height:1px;background:#392040;margin:20px 0}@media(max-width:800px){.grid,.grid3{grid-template-columns:1fr}}@media(max-width:600px){h1{font-size:32px}.member{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="top"><div class="brand"><span>HUB</span> DE MIIANA</div><a class="btn alt" href="index.html">← Retour au Hub</a></div><section id="login" class="card"><div class="brand">🔐 Connexion</div><h1>Panneau d'administration</h1><p class="muted">Connecte-toi ou crée ton compte.</p><form id="loginForm" class="stack"><input id="email" class="input" type="email" required placeholder="Email"><input id="password" class="input" type="password" minlength="6" required placeholder="Mot de passe"><div class="row"><button type="submit" class="btn">Se connecter</button><button id="signupBtn" type="button" class="btn alt">Créer mon compte</button></div><button id="forgotBtn" type="button" class="linkbtn">🔑 Mot de passe oublié ?</button></form><div id="loginMsg"></div></section><section id="dashboard" class="hidden"><div class="top card"><div><div class="brand">👑 Administration</div><p id="userInfo" class="muted"></p></div><button id="logoutBtn" class="btn alt">Déconnexion</button></div><div id="dashMsg"></div><div class="grid"><div class="card"><h2>📁 Créer une catégorie</h2><form id="catForm" class="stack"><input id="catTitle" class="input" required placeholder="Nom de la catégorie"><input id="catIcon" class="input" placeholder="Emoji, ex. 🎮"><textarea id="catDesc" placeholder="Description"></textarea><button class="btn">➕ Créer la catégorie</button></form></div><div class="card"><h2>📝 Ajouter du contenu</h2><form id="itemForm" class="stack"><select id="itemCategory" required></select><input id="itemTitle" class="input" required placeholder="Titre"><input id="itemLink" class="input" placeholder="Lien (optionnel)"><textarea id="itemDesc" placeholder="Description"></textarea><button class="btn">➕ Ajouter</button></form></div></div><div class="card" style="margin-top:16px"><div class="top"><div><h2>📚 Catégories</h2><p class="muted">Crée et gère les espaces de ton Hub.</p></div></div><div id="categories"></div></div><div class="card" style="margin-top:16px"><h2>👥 Équipe & rôles</h2><p class="muted">Le Fondateur et le Co-Fondateur peuvent attribuer les rôles.</p><div id="members"></div></div></section></main><script>'use strict';(function(){const cfg=window.SUPABASE_CONFIG||{};const out=document.getElementById('loginMsg');const dashMsg=document.getElementById('dashMsg');function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}function show(el,text,ok){el.innerHTML='<div class="msg '+(ok?'ok':'err')+'">'+esc(text)+'</div>';}if(!window.supabase||!cfg.url||!cfg.anonKey){show(out,'Configuration Supabase introuvable.');return}const sb=window.supabase.createClient(cfg.url,cfg.anonKey);const $=id=>document.getElementById(id);let profile=null;function isManager(){return profile&&['fondateur','co_fondateur'].includes(profile.role)}async function signup(){const email=$('email').value.trim(),password=$('password').value;if(!email||!password){show(out,'Entre un email et un mot de passe.');return}show(out,'Création du compte...',true);const r=await sb.auth.signUp({email,password,options:{emailRedirectTo:location.origin+location.pathname}});if(r.error){show(out,r.error.message);return}show(out,r.data.session?'Compte créé et connecté.':'Compte créé. Vérifie ton email si une confirmation est demandée.',true)}async function forgot(){const email=$('email').value.trim();if(!email){show(out,'Entre ton adresse email.');return}const r=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});if(r.error){show(out,r.error.message);return}show(out,'Email de réinitialisation envoyé. Vérifie ta boîte mail.',true)}async function login(e){e.preventDefault();const r=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(r.error){show(out,r.error.message);return}await start(r.data.user)}async function start(user){$('login').classList.add('hidden');$('dashboard').classList.remove('hidden');const q=await sb.from('profiles').select('*').eq('id',user.id).maybeSingle();profile=q.data;if(!profile){await sb.from('profiles').insert({id:user.id,username:user.email.split('@')[0],role:'membre'});profile=(await sb.from('profiles').select('*').eq('id',user.id).maybeSingle()).data}$('userInfo').textContent=(profile?.username||user.email)+' • rôle : '+(profile?.role||'membre');await loadAll()}async function loadAll(){await loadCategories();await loadMembers()}async function loadCategories(){const r=await sb.from('categories').select('*,category_items(*)').order('position').order('created_at');if(r.error){show(dashMsg,r.error.message);return}const cats=r.data||[];$('itemCategory').innerHTML=cats.map(c=>'<option value="'+esc(c.id)+'">'+esc(c.icon||'📁')+' '+esc(c.title)+'</option>').join('');$('categories').innerHTML=cats.length?cats.map(c=>'<div class="category"><div class="top"><div><span class="pill">'+esc(c.icon||'📁')+'</span> <b>'+esc(c.title)+'</b><p class="muted">'+esc(c.description||'')+'</p></div>'+(isManager()?'<button class="btn danger" onclick="deleteCategory(\''+c.id+'\')">🗑️ Supprimer</button>':'')+'</div>'+((c.category_items||[]).map(i=>'<div class="member"><div><b>📝 '+esc(i.title)+'</b><small class="muted">'+esc(i.description||'')+'</small></div>'+(i.link?'<a class="btn alt" target="_blank" href="'+esc(i.link)+'">Ouvrir ↗</a>':'')+'</div>').join('')||'<p class="muted">Aucun contenu.</p>')+'</div>').join(''):'<p class="muted">Aucune catégorie.</p>'}async function loadMembers(){const r=await sb.from('profiles').select('id,username,role,created_at').order('created_at');if(r.error){$('members').innerHTML='<div class="msg err">'+esc(r.error.message)+'</div>';return}const can=isManager();$('members').innerHTML=(r.data||[]).map(m=>'<div class="member"><div><b>👤 '+esc(m.username||'Membre')+'</b><div class="role">'+esc(m.role)+'</div></div>'+(can?'<div class="row"><select class="input" style="width:auto" id="role-'+m.id+'"><option value="fondateur">Fondateur</option><option value="co_fondateur">Co-Fondateur</option><option value="admin">Admin</option><option value="staff">Staff</option><option value="helpeur">Helpeur</option><option value="membre">Membre</option></select><button class="btn" onclick="setRole(\''+m.id+'\')">💾 Enregistrer</button></div>':'<span class="pill">'+esc(m.role)+'</span>')+'</div>').join('')||'<p class="muted">Aucun membre.</p>';(r.data||[]).forEach(m=>{const s=$('role-'+m.id);if(s)s.value=m.role})}window.setRole=async function(id){if(!isManager()){show(dashMsg,'Seul le Fondateur ou le Co-Fondateur peut modifier les rôles.');return}const role=$('role-'+id).value;const r=await sb.rpc('set_user_role',{target_user_id:id,new_role:role});if(r.error){show(dashMsg,r.error.message);return}show(dashMsg,'Rôle mis à jour avec succès.',true);loadMembers()};window.deleteCategory=async function(id){if(!isManager()||!confirm('Supprimer cette catégorie et son contenu ?'))return;const r=await sb.from('categories').delete().eq('id',id);if(r.error){show(dashMsg,r.error.message);return}loadCategories()};$('signupBtn').addEventListener('click',signup);$('forgotBtn').addEventListener('click',forgot);$('loginForm').addEventListener('submit',login);$('logoutBtn').addEventListener('click',async()=>{await sb.auth.signOut();location.reload()});$('catForm').addEventListener('submit',async e=>{e.preventDefault();const u=await sb.auth.getUser();if(!u.data.user)return show(dashMsg,'Connecte-toi d’abord.');const r=await sb.from('categories').insert({title:$('catTitle').value.trim(),description:$('catDesc').value.trim(),icon:$('catIcon').value.trim()||'📁',created_by:u.data.user.id});if(r.error)show(dashMsg,r.error.message);else{e.target.reset();show(dashMsg,'Catégorie créée.',true);loadCategories()}});$('itemForm').addEventListener('submit',async e=>{e.preventDefault();const u=await sb.auth.getUser();if(!u.data.user)return;const r=await sb.from('category_items').insert({category_id:$('itemCategory').value,title:$('itemTitle').value.trim(),description:$('itemDesc').value.trim(),link:$('itemLink').value.trim(),created_by:u.data.user.id});if(r.error)show(dashMsg,r.error.message);else{e.target.reset();show(dashMsg,'Contenu ajouté.',true);loadCategories()}});sb.auth.getSession().then(r=>{if(r.data.session)start(r.data.session.user)})})()</script></body></html>
