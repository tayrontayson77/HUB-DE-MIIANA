<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administration — HUB DE MIIANA</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><style>:root{--bg:#08060d;--card:#160d1e;--line:#43254b;--red:#ff3865;--violet:#8b3dff;--muted:#b9a7bd}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 70% 0,#421044,#08060d 55%);color:#fff;font-family:Arial,sans-serif;min-height:100vh}.wrap{width:min(1100px,94%);margin:auto;padding:40px 0}.card{background:#160d1eee;border:1px solid var(--line);border-radius:16px;padding:24px;box-shadow:0 20px 70px #0007}.brand{font-size:24px;font-weight:900}.brand span{color:var(--red)}h1{font-size:42px;margin:10px 0}.muted{color:var(--muted);line-height:1.6}.stack{display:grid;gap:12px}.input,textarea,select{width:100%;padding:12px;border-radius:9px;border:1px solid var(--line);background:#0d0812;color:#fff;font:inherit}.btn{padding:12px 16px;border:0;border-radius:9px;color:#fff;font-weight:900;background:linear-gradient(135deg,var(--red),var(--violet));cursor:pointer}.btn.alt{background:#211226;border:1px solid var(--line)}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.hidden{display:none!important}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.msg{padding:12px;border-radius:9px;background:#211326;margin:10px 0}.ok{border:1px solid #3b754e}.err{border:1px solid #7b2947}.linkbtn{background:none;border:0;color:#b98cff;text-decoration:underline;cursor:pointer;padding:0;font:inherit}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.category{padding:18px;background:#211326;border:1px solid #392040;border-radius:12px;margin-top:12px}.item{margin-top:10px;padding:12px;background:#140b19;border-radius:9px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="top"><div class="brand"><span>HUB</span> DE MIIANA</div><a class="btn alt" href="index.html">← Retour</a></div><section id="login" class="card"><div class="brand">🔐 Connexion</div><h1>Panneau d'administration</h1><p class="muted">Connecte-toi ou crée ton compte.</p><form id="loginForm" class="stack"><input id="email" class="input" type="email" required placeholder="Email"><input id="password" class="input" type="password" minlength="6" required placeholder="Mot de passe"><div class="row"><button type="submit" class="btn">Se connecter</button><button id="signupBtn" type="button" class="btn alt">Créer mon compte</button></div><button id="forgotBtn" type="button" class="linkbtn">🔑 Mot de passe oublié ?</button></form><div id="loginMsg"></div></section><section id="dashboard" class="card hidden"><div class="top"><div><div class="brand">👑 Administration</div><p id="userInfo" class="muted"></p></div><button id="logoutBtn" class="btn alt">Déconnexion</button></div><div class="grid"><div class="card"><h2>📁 Créer une catégorie</h2><form id="catForm" class="stack"><input id="catTitle" class="input" required placeholder="Nom de la catégorie"><input id="catIcon" class="input" placeholder="Emoji, ex. 🎮"><textarea id="catDesc" placeholder="Description"></textarea><button class="btn">➕ Créer la catégorie</button></form></div><div class="card"><h2>➕ Ajouter du contenu</h2><form id="itemForm" class="stack"><select id="itemCategory" required></select><input id="itemTitle" class="input" required placeholder="Titre"><input id="itemLink" class="input" placeholder="Lien"><textarea id="itemDesc" placeholder="Description"></textarea><button class="btn">Ajouter</button></form></div></div><div class="card" style="margin-top:16px"><h2>📚 Catégories</h2><div id="categories"></div></div></section></main><script>
'use strict';
(function(){
  const cfg=window.SUPABASE_CONFIG||{};
  const out=document.getElementById('loginMsg');
  function show(text,ok){out.innerHTML='<div class="msg '+(ok?'ok':'err')+'">'+String(text).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})+'</div>';}
  if(!window.supabase||!cfg.url||!cfg.anonKey){show('Configuration Supabase introuvable. Recharge la page dans quelques instants.');return;}
  const sb=window.supabase.createClient(cfg.url,cfg.anonKey);
  const $=function(id){return document.getElementById(id)};
  async function signup(){
    const email=$('email').value.trim(), password=$('password').value;
    if(!email||!password){show('Entre un email et un mot de passe.');return;}
    show('Création du compte... ',true);
    const r=await sb.auth.signUp({email:email,password:password,options:{emailRedirectTo:location.origin+location.pathname}});
    if(r.error){show(r.error.message);return;}
    show(r.data.session?'Compte créé et connecté.':'Compte créé. Vérifie ton email si une confirmation est demandée.',true);
  }
  async function forgot(){
    const email=$('email').value.trim();
    if(!email){show('Entre ton adresse email.');return;}
    const r=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});
    if(r.error){show(r.error.message);return;}
    show('Email de réinitialisation envoyé. Vérifie ta boîte mail.',true);
  }
  async function login(e){
    e.preventDefault();
    const r=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});
    if(r.error){show(r.error.message);return;}
    await start(r.data.user);
  }
  async function start(user){
    $('login').classList.add('hidden');$('dashboard').classList.remove('hidden');
    let p=(await sb.from('profiles').select('*').eq('id',user.id).maybeSingle()).data;
    if(!p){await sb.from('profiles').insert({id:user.id,username:user.email.split('@')[0],role:'membre'});p=(await sb.from('profiles').select('*').eq('id',user.id).maybeSingle()).data;}
    $('userInfo').textContent=(p&&p.username?p.username:user.email)+' • rôle : '+(p&&p.role?p.role:'membre');
    await loadAll();
  }
  async function loadAll(){
    const r=await sb.from('categories').select('*').order('position').order('created_at');
    if(r.error){$('categories').innerHTML='<div class="msg err">'+r.error.message+'</div>';return;}
    const cats=r.data||[]; $('itemCategory').innerHTML=cats.map(function(c){return '<option value="'+c.id+'">'+(c.icon||'📁')+' '+c.title+'</option>';}).join('');
    $('categories').innerHTML=cats.length?cats.map(function(c){return '<div class="category"><b>'+(c.icon||'📁')+' '+c.title+'</b><p class="muted">'+(c.description||'')+'</p></div>';}).join(''):'<p class="muted">Aucune catégorie.</p>';
  }
  $('signupBtn').addEventListener('click',signup);$('forgotBtn').addEventListener('click',forgot);$('loginForm').addEventListener('submit',login);
  $('logoutBtn').addEventListener('click',async function(){await sb.auth.signOut();location.reload()});
  $('catForm').addEventListener('submit',async function(e){e.preventDefault();const r=await sb.auth.getUser();if(!r.data.user){show('Connecte-toi d’abord.');return;}const x=await sb.from('categories').insert({title:$('catTitle').value.trim(),description:$('catDesc').value.trim(),icon:$('catIcon').value.trim()||'📁',created_by:r.data.user.id});if(x.error){alert(x.error.message);return;}e.target.reset();loadAll();});
  $('itemForm').addEventListener('submit',async function(e){e.preventDefault();const r=await sb.auth.getUser();if(!r.data.user)return;const x=await sb.from('category_items').insert({category_id:$('itemCategory').value,title:$('itemTitle').value.trim(),description:$('itemDesc').value.trim(),link:$('itemLink').value.trim(),created_by:r.data.user.id});if(x.error)alert(x.error.message);else{e.target.reset();loadAll();}});
  sb.auth.onAuthStateChange(function(event,session){if(event==='PASSWORD_RECOVERY'){show('Session de récupération active.');}});
  sb.auth.getSession().then(function(r){if(r.data.session)start(r.data.session.user);});
})();
</script></body></html>
