<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administration — HUB DE MIIANA</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><style>body{margin:0;background:#08060d;color:#fff;font-family:Arial,sans-serif}.wrap{width:min(900px,94%);margin:auto;padding:40px}.card{background:#160d1e;border:1px solid #43254b;border-radius:16px;padding:24px;margin-bottom:16px}.btn{padding:12px 16px;border:0;border-radius:9px;color:#fff;font-weight:900;background:linear-gradient(135deg,#ff3865,#8b3dff);cursor:pointer}.input,textarea,select{width:100%;padding:12px;margin:6px 0;border-radius:9px;border:1px solid #43254b;background:#0d0812;color:#fff;box-sizing:border-box}.hidden{display:none}.msg{padding:12px;margin:10px 0;border-radius:9px;background:#211326}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="card"><h1>👑 HUB DE MIIANA — Administration</h1><p>Accès réservé au Fondateur.</p></div><section id="login" class="card"><h2>🔐 Connexion sans mot de passe</h2><p>Entre ton adresse e-mail. Tu recevras un lien sécurisé pour ouvrir l'administration.</p><input id="email" class="input" type="email" value="tayron.tayson77@gmail.com" placeholder="Email"><button id="loginBtn" class="btn">📧 Recevoir mon lien de connexion</button><div id="msg" class="msg"></div></section><section id="dashboard" class="hidden"><div class="card"><h2>Bienvenue, Fondateur 👑</h2><button id="logout" class="btn">Déconnexion</button></div><div class="grid"><div class="card"><h2>📁 Créer une catégorie</h2><input id="catTitle" class="input" placeholder="Nom"><input id="catIcon" class="input" placeholder="Emoji 📁"><textarea id="catDesc" class="input" placeholder="Description"></textarea><label for="catVisibility"><b>🔐 Niveau d'accès</b></label><select id="catVisibility" class="input"><option value="public">🌐 Public</option><option value="membre">👤 Membres</option><option value="helpeur">🆘 Helpeurs</option><option value="staff">🔧 Staff</option><option value="admin">🛡️ Admin</option><option value="direction">👑 Direction</option></select><button id="addCat" class="btn">Créer</button></div><div class="card"><h2>📝 Ajouter du contenu</h2><select id="catSelect" class="input"></select><input id="itemTitle" class="input" placeholder="Titre"><input id="itemLink" class="input" placeholder="Lien"><textarea id="itemDesc" class="input" placeholder="Description"></textarea><button id="addItem" class="btn">Ajouter</button></div></div><div class="card"><h2>📚 Catégories</h2><div id="cats"></div></div></section></main><script>(async()=>{const c=window.SUPABASE_CONFIG||{};const msg=t=>document.getElementById('msg').textContent=t;const sb=supabase.createClient(c.url,c.anonKey);const allowed='tayron.tayson77@gmail.com';async function showDashboard(session){if(!session||session.user.email.toLowerCase()!==allowed){await sb.auth.signOut();msg('⛔ Accès refusé.');return}const p=(await sb.from('profiles').select('role').eq('id',session.user.id).maybeSingle()).data;if(!p||p.role!=='fondateur'){await sb.auth.signOut();msg('⛔ Ton compte doit avoir le rôle fondateur.');return}document.getElementById('login').classList.add('hidden');document.getElementById('dashboard').classList.remove('hidden');load()}document.getElementById('loginBtn').onclick=async()=>{const email=document.getElementById('email').value.trim().toLowerCase();if(email!==allowed){msg('⛔ Cette adresse n’est pas autorisée.');return}const r=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:window.location.href}});if(r.error)msg('❌ '+r.error.message);else msg('✅ Lien envoyé ! Vérifie ta boîte mail puis clique sur le lien.');};async function load(){const r=await sb.from('categories').select('*').order('position');const cats=r.data||[];document.getElementById('catSelect').innerHTML=cats.map(x=>`<option value="${x.id}">${x.icon||'📁'} ${x.title}</option>`).join('');document.getElementById('cats').innerHTML=cats.map(x=>`<div class="card"><b>${x.icon||'📁'} ${x.title}</b><p>${x.description||''}</p><small>🔐 Accès : ${({public:'🌐 Public',membre:'👤 Membres',helpeur:'🆘 Helpeurs',staff:'🔧 Staff',admin:'🛡️ Admin',direction:'👑 Direction'})[x.visibility]||'🌐 Public'}</small></div>`).join('')||'Aucune catégorie.'}document.getElementById('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};document.getElementById('addCat').onclick=async()=>{const u=(await sb.auth.getUser()).data.user;if(!u)return;const r=await sb.from('categories').insert({title:catTitle.value.trim(),icon:catIcon.value.trim()||'📁',description:catDesc.value.trim(),visibility:catVisibility.value,created_by:u.id});if(r.error)alert(r.error.message);else{catTitle.value='';catIcon.value='';catDesc.value='';catVisibility.value='public';load()}};document.getElementById('addItem').onclick=async()=>{const u=(await sb.auth.getUser()).data.user;if(!u)return;const r=await sb.from('category_items').insert({category_id:catSelect.value,title:itemTitle.value.trim(),description:itemDesc.value.trim(),link:itemLink.value.trim(),created_by:u.id});if(r.error)alert(r.error.message);else{itemTitle.value='';itemDesc.value='';itemLink.value='';alert('Contenu ajouté !')}};const s=await sb.auth.getSession();if(s.data.session)showDashboard(s.data.session);})();</script></body></html>
